<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to My simple Website</h1>
      <section id="counter-section">
        <h2>Idea was to create a simple visitor counter</h2>
        <p>You are visitor number: <span id="counter">Ladataan...</span></p>
        <br />
        <br />
        <p>Btw background was fully made by AI</p>
      </section>
    </div>
    <script>
      window.addEventListener("DOMContentLoaded", (event) => {
        getVisitorCount();
      });

      async function getVisitorCount() {
        try {
          const response = await fetch("/api/counter");
          const data = await response.json();

          document.getElementById("counter").innerText = data.count;
        } catch (error) {
          console.error("Virhe laskurin haussa:", error);
          document.getElementById("counter").innerText = "virhe";
        }
      }
    </script>
  </body>
</html>
